# GENERATED from config/s10_params.yaml (section `nav`) by tools/params.py sync. DO NOT EDIT: this file is
# overwritten at every start. Change the master file instead (it is LOCKED: operator approval needed).
# s10_rl_nav_ros1: the team's route runner on the real S10 (ROS 1, AGX).
# Inputs: x_nav pose + gateway lidar. Output: /rl_nav/cmd_vel + /rl_nav/gait_request
# for s10_ros1_control (cmd_source rl_nav).

pose_topic: /base_link/odom          # x_nav localisation (Odometry / PoseStamped / PoseWithCovarianceStamped)
lidar_topic: /LIDAR/POINTS           # gateway, lidar frame (frame_id lidar_link)
attitude_topic: /IMU                 # robot IMU: roll/pitch for levelling (x_nav's are biased); "" = use the pose
gait_topic: /s10_control/gait        # confirmed gait from s10_ros1_control
control_state_topic: /s10_control/state

control_rate: 20.0
pose_timeout: 0.3                    # s; older pose -> zero command
obs_timeout: 0.5                     # s; older grid/scan -> the runner gets none
max_points: 60000                    # cloud subsample before the height grid (CPU bound)

# Lidar blind zone around the body (no floor returns): unseen cells within this radius take the
# nearest seen height. 0 = off. Measured on dog 048: no returns within about 0.6 m ahead.
blind_radius: 1.1

# The robot's own body and legs in the cloud, and the floor it stands on (2026-09-20, dog 048: every
# candidate "blocked at 0.00 m" every other second while walking on a clear floor).
self_box: [0.62, 0.33, -0.30]        # |x| < 0.62, |y| < 0.33, z > -0.30 m: dropped before the grid and the scan
self_clear_radius: 0.6               # grid cells this close to the body centre = median floor height

# Body reference point above the ground the route's z refers to (route z_reference: ground).
# MEASURED on dog 048 standing in RL control, 2026-09-20 (tools/check_ground_plane.py: ground
# 0.414 m below the cloud origin; /MOTION_INFO height 0.419). Use the same number in
# teach_to_route.py (--body-z-offset). Lying down is 0.07-0.08.
body_z_offset: 0.41

# /LIDAR/POINTS (frame lidar_link) is the vendor driver's MERGED cloud of the front and back
# lidars. The driver's per-lidar extrinsics (front x=+0.22341, back x=-0.22341, z=-0.0001) are
# the same as front_lidar_joint / back_lidar_joint in S10.urdf relative to base_link, so the
# merged cloud is already in base_link: identity here. Checked on live data by
# tools/check_ground_plane.py (ground level and at -body height).
lidar_extrinsics:
  translation: [0.0, 0.0, 0.0]
  rpy_deg: [0.0, 0.0, 0.0]

# x_nav map -> route map (only when the route was made on another map). Empty: identity.
route_from_xnav_file: ""

lookahead: 1.0
fuse_frames: 6                       # was 3: steadier height grid
max_step_flat: 0.15                  # real lidar: 2-3 cm noise plus a 5-8 cm ridge seen on flat floor (0.07 flickered BLOCKED)

# Stairs zones with the VENDOR gaits: "gait_only" = same follower, the zone only switches the gait (by arc
# length, where the operator switched it) and applies the stairs speed cap; inside a zone the local height
# grid and scan are ignored (zone_blind): the taught line is followed as the operator walked it.
# "maneuver" = the approach / align / climb state machine made for the RL stairs policy.
ignore_pose_z: true                  # height from the route, not from x_nav (unreliable z); single-level courses only
tracker_back: 0.2                    # m the route projection may move backwards (dead-end turn-arounds: see nav_core)
zone_mode: gait_only                 # 2026-09-21: full v7_o course 29/29 in the kinematic simulation (tests/nav/sim_full_route.py)
zone_blind: true

# Path tracking. 2026-09-20 on dog 048 at 0.7 m/s: yaw commands flipped between +0.8 and -0.8 rad/s
# every second with only a few cm of cross-track error, forward speed was zeroed for "pivots" and the
# local planner flickered between centreline / detour / A* on a clear floor: 5 m took 36 s. Hence:
gains:
  max_forward: 0.6
  max_lateral: 0.2
  max_yaw_rate: 1.0                # robot maximum (was 0.6 / 0.8): faster pivots at waypoints
  lookahead: 1.0
  lookahead_speed_gain: 0.8          # carrot = 1.0 m + 0.8 s * v (regulated pure pursuit): calmer at speed
  yaw_gain: 1.0                      # was 1.8
  lateral_gain: 0.6                  # was 0.9
  pivot_threshold_deg: 70.0          # was 35: turn on the spot only when really needed
  align_falloff_deg: 120.0           # between aligned and the pivot limit, slow down gently ...
  min_speed_fraction: 0.7   # 2026-09-21 20:50 back to 0.7 (operator): with 1.0 the dog ran full speed while still turning after stops/starts (runs 20:02-20:15). 16:40-20:50 it was 1.0
  brake_distance: 0.6                # ease into the last waypoint instead of overshooting
  forward_slew: 3.0   # strategy1: was 1.0
  yaw_slew: 4.0   # strategy1: was 2.0
  lateral_slew: 0.8                  # m/s^2

# Local planner costs: leaving the taught line must be expensive, so it happens for a real obstacle,
# not for one noisy frame. (w_smooth must stay below w_lat.)
planner:
  w_lat: 3.0                         # was 1.0: cost of a lateral offset
  w_smooth: 1.0                      # was 0.3
  w_side_switch: 3.0                 # was 1.0: changing side
  switch_margin: 1.0                 # was 0.3: keep the current target unless another is clearly better
  astar_lateral_weight: 5.0          # was 2.0: A* paths hug the taught line, turn only where needed
  astar_speed_fraction: 0.7          # was 0.5
  min_speed_fraction: 0.7   # strategy1 (09-21): was 0.4 in gains / 0.6 in planner; keep the speed on a straight line
  commit_length_flat: 0.6            # was 1.0: the live grid reaches ~0.9 m; 1.0 also flickered BLOCKED in the last metre
                                     # before a waypoint (free length = remaining length, quantised), freezing the run
  min_horizon: 0.65                  # was 0.3. Closer than this to a waypoint the robot heads straight for it. Must be
                                     # > commit_length: below it the planner compares a quantised free length with the
                                     # remaining distance and wrongly reports BLOCKED (always, where detours are off)
  inflation: 0.20                    # 09-21: was 0.3 (team default). Obstacle or unknown cells within this distance of the body
                                     # slow the robot in proportion, to half speed at most
  full_speed_free_length: 0.8   # strategy1: was 1.0; the live grid reaches ~0.9 m, 1.0 kept the scale below 1 on open road

# Bowling lane: inside +-half_width of the taught line (and within heading_deg of its direction) the
# robot gets NO lateral or heading correction. Outside, the correction grows smoothly from the lane
# edge and ends at `release`. Beyond handback_* the follower's own command is used.
lane:
  enabled: true
  half_width: 0.10                   # m
  release: 0.05                      # m  (hysteresis: correction ends here)
  heading_deg: 6.0                   # heading dead band
  heading_gain: 1.2   # strategy1: was 0.8
  heading_max_wz: 0.6   # strategy1: was 0.35 rad/s
  return_gain: 0.8                   # 1/s on (|d| - release)
  return_max_vy: 0.15                # m/s sideways while returning
  handback_d: 0.35                   # m
  handback_heading_deg: 25.0
  corner_deg: 12.0                   # the route turns more than this within the next 1.2 m: the follower steers
  end_zone: 1.0                      # m before the route end: follower brakes and aligns
  steer: true                        # strategy1: come back to the line by STEERING (Stanley), not by side-stepping
  steer_gain: 0.9                    # 1/s: heading offset = atan(gain * offset / speed)
  steer_max_deg: 20.0
  steer_vy_share: 0.3                # share of the old sideways correction that is kept

# Output smoothing (20 Hz): acceleration limits + low pass. HOLD / DONE / pause stop at once.
smooth:
  enabled: true
  accel: 2.0   # strategy1: was 0.6 m/s^2
  decel: 3.0   # strategy1: was 1.0
  vy_accel: 0.5
  wz_accel: 4.0   # strategy1: was 1.5 rad/s^2
  vy_tau: 0.10   # strategy1: was 0.25 s
  wz_tau: 0.10   # strategy1: was 0.25 s
# (walk 0.6 / floor 0.5 / climb 0.3) are the RL policies'; the native flat gait has no stall
# floor. s10_ros1_control clamps to its own limits (0.30 / 0.10 / 0.50) on top of these.
runner_params:
  walk_v: 0.30
  walk_floor: 0.0
  climb_v: 0.15
  climb_turn_v: 0.10
  approach_v: 0.20
  detour_v: 0.20
  recover_v: 0.20
  backup_v: 0.15
  drop_v: 0.10
  settle_v: 0.15

# Localisation jump between two pose messages -> pause until the operator sends "start" again.
pose_jump_m: 0.5
pose_jump_deg: 30.0

# Speed inside a stairs-gait zone (strategy1). The operator's own median in the stairs gait was 0.73 m/s.
# steep = where the ground map shows steps / slope (terrain.json next to the route). nav_session arm <v> <climb v>
# replaces cruise.
# READJUST instead of HOLD (operator, 2026-09-21 18:40): off the line, stalled or refused at a gate, the dog walks
# on slowly and steers back to the taught line (see nav_core._install_readjust). HOLD only for safety.
readjust:
  enabled: true
  speed: 0.5                       # m/s forward while coming back (was 0: a side-step only, which fails in the stairs gait)
  lookahead: 1.2                   # m carrot on the line
  max_yaw: 0.8                     # rad/s
  lateral: 0.15                    # m/s side-step share
  hold_beyond_m: 1.5               # farther than this from the line: HOLD
  timeout_s: 20.0                  # readjusting this long without 0.5 m of progress: HOLD

# JUMP LANE (operator, 2026-09-21 20:30: the gap between the steel stools on the WP17 ledge is about the dog's width).
# Before a ledge from terrain.json `jumps`: slow straight approach, one check of the body against the lane, pivot /
# back up and come again, HOLD only if still off (see nav_core._jump_step).
jump:
  enabled: true
  approach_speed: 0.35             # m/s over the straight before the ledge (operator: 0.33-0.37 there)
  check_at_m: 0.7                  # body centre this far before the ledge when it is checked (nose 0.25 m before it)
  tol_lateral: 0.10                # m beside the lane. Was 0.05; operator 21:20: "don't be so strict"
  tol_yaw_deg: 10.0                # deg off square (was 5)
  backup_m: 0.5                    # m backed up along the lane before coming again (operator: 1 m is too much)
  backup_speed: 0.2                # m/s
  retries: 2                       # then: go anyway, unless more than hold_beyond_m beside the lane
  hold_beyond_m: 0.25              # m: only this far off after the retries is a HOLD (the body would hit what stands beside the gap)
  pivot_timeout_s: 8.0
  track: true                      # in a platform zone (0.4 m/s): short-carrot tracking instead of the follower's 1.3 m carrot
  track_lookahead: 0.5             # m
  track_yaw_gain: 2.0              # rad/s per rad
  track_max_yaw: 0.6               # rad/s

# Entering a stairs / platform zone (added 2026-09-21 16:10 after two runs at --speed 1.67 got stuck on the first
# steps: see nav_core). The dog brakes before the zone so that it ARRIVES at entry_speed, and the zone (gait request,
# zone speed, blind stretch) begins lead_m before the recorded start.
zone_entry:
  lead_m: 0.6                      # m
  entry_speed: 0.3                 # m/s at the zone start (the first version arrived at 0.29 and always switched)
  decel: 0.8                       # m/s^2 used for the braking curve before the zone (from 1.67 m/s: the last 1.7 m)

zone_speed:
  cruise: 0.7
  steep: 0.0                         # 0 = no separate cap on real steps: the whole stairs zone runs at --climb-speed (was 0.45, my own guess)
  walk: 0.0                          # 0 = no extra cap: the walk gait 0x3002 runs at the run's --speed (as in the room test)
  platform: 0.4                      # 0x1002 高台: climbing a ledge

# Planner speed scale while the plan IS the taught line (TRACK, or DETOUR with zero target offset). The team planner
# halves the speed near obstacle/unknown cells; our 0.9 m live grid has an unknown rim, so it slowed open road too.
# Real detours, A* and BLOCKED are untouched. 0 = team behaviour (for comparison / rollback).
# On the line the scale is planner_scale_on_line * (1 - 0.5 * proximity): only the 0.20 m proximity rule slows it.
planner_scale_on_line: 1.0

# Corner speed (regulated pure pursuit idea): above v_ref the speed falls linearly with the turn the taught line
# makes within the next ~1.5 s of travel; a turn of full_stop_deg or more brings it down to v_ref.
corner_speed:
  enabled: true
  v_ref: 0.6                         # 2026-09-21 20:50 back to 0.6 (operator): 1.0 was a floor that kept 1 m/s through big heading errors
  full_stop_deg: 90.0
