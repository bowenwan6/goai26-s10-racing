# Install on 106 under /etc/systemd/system/<unit>.service.d/ for
# yesense, rsdriver, hsLidar, localization, mapping. Uses existing vendor PTP.
[Unit]
Wants=ptp_manage.service
After=ptp_manage.service

[Service]
ExecStartPre=+/usr/bin/python3 /usr/local/lib/s10/wait_s10_ptp.py --timeout 60
TimeoutStartSec=90
