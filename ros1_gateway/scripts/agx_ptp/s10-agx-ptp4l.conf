# AGX PTP client, same parameters as the robot's 106 (/var/run/ptp/ptp4l_eth0.conf):
# follows the robot's PTP master (103) so AGX system time == robot sensor time.
[global]
logging_level 6
domainNumber 0
time_stamping hardware
utc_offset 0
serverOnly 0
clientOnly 1
BMCA noop
network_transport UDPv4
delay_mechanism E2E
logAnnounceInterval -2
logSyncInterval -2
logMinDelayReqInterval -2
step_threshold 10.0
tx_timestamp_timeout 50
announceReceiptTimeout 40
syncReceiptTimeout 40
fault_reset_interval 1
uds_address /var/run/s10-ptp4l
[end0]
