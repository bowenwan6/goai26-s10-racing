# Stable frontal Gate16 strategy configuration. This file is opt-in at launch.
#
# This file is only read when the race is launched with strategy_router:=true. The default
# scored run does not start this node at all, so nothing here can change it.
#
# The segment-to-policy mapping lives here and only here. The temptation is to write
# `if waypoint == 16` in the follower, in the router and in the runner, and the moment that
# test exists in three files two of them are wrong and the third is the one in the run.
#
# The router is still opt-in at launch. When it is selected, this configuration enables the
# frozen stable Gate16 actor for segment 15->16; mock and scripted remain test-only choices.

strategy_router:
  ros__parameters:
    control_rate: 50.0

    nav_cmd_topic: /strategy/nav_cmd_vel
    cmd_vel_topic: /cmd_vel

    climb_enabled: true
    measurement_only: false
    # Stable frontal 174D base+residual. Adaptive mirroring and command profiles remain off.
    climb_policy: gate16
    climb_segment: [15, 16]
    scripted_trajectory: ""
    # succeed | fail | never_finish | go_silent | raise | lie
    mock_scenario: succeed
    mock_duration: 2.0

    # Gate 16's leading edge, measured off the MJCF rather than assumed from the waypoint:
    # the lip sits at x = 12.6459 with a 0.3769 m rise from a floor at z = 0.102. The
    # waypoint is not on the lip, and approaching as though it were starts the align phase
    # in the wrong place. Leave as NaN for any segment whose geometry has not been measured.
    climb_obstacle_x: 12.6459
    climb_edge_center: [12.64593, 32.49969]
    climb_normal: [1.0, 0.0]
    climb_tangent: [0.0, 1.0]
    # Must match nav.yaml: the router runs its own cursor over the same course file, and
    # two cursors advancing on different rules disagree about which segment is current.
    advance_radius: 0.35
    score_radius: 0.2

    approach_enter: 3.0
    approach_speed_scale: 0.5
    align_enter: 1.6
    align_timeout: 40.0
    climb_timeout: 20.0
    climb_progress_window: 12.0
    max_retries: 0
    sensor_timeout: 0.2
    ready_distance_min: 0.55
    ready_distance_max: 0.70
    ready_dwell: 0.10
    min_entry_speed: 0.10
    max_entry_speed: 0.30
    target_entry_speed: 0.25
    max_entry_yaw_rate: 0.10
    align_yaw_rate: 0.70
    max_lateral_error: 0.25
    gate16_staging_tolerance: 0.25
    verify_clearance: 0.02
    verify_hold: 0.30
    verify_timeout: 3.0
    verify_deck_z: 0.4787248
