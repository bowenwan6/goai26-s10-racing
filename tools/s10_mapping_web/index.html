<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f0">
<title>S10 采集助手</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#172a29;background:#f4f5f0;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}
main{max-width:460px;margin:auto;padding:40px 18px}h1{font-size:24px;margin:0 0 6px}p{color:#586a63;font-size:14px;line-height:1.7}
label{display:block;font-size:13px;color:#52665b;margin:12px 0 6px}
input{width:100%;min-height:48px;border:1px solid #bac8bd;border-radius:9px;padding:10px 12px;font:inherit;background:#fff}
button,a.btn{display:block;width:100%;min-height:58px;margin-top:16px;border:0;border-radius:11px;font:inherit;font-size:18px;font-weight:650;color:#fff;background:#166b54;cursor:pointer;text-align:center;text-decoration:none;line-height:58px}
a.btn.alt{background:#6b3fa0}#msg{color:#822b23;min-height:20px;margin-top:10px}
</style>
<main>
  <h1>S10 采集助手</h1>
  <p>建图采集 · 标 WP / 台阶切换点 · 示教路径。只记录数据，行走和急停用遥控器。</p>
  <form id="login" hidden>
    <label for="username">用户名</label><input id="username" value="golai" autocomplete="username" required>
    <label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
    <div id="msg" role="alert"></div>
  </form>
  <div id="links" hidden>
    <a class="btn" href="/teach">进入采集助手</a>
    <a class="btn alt" id="xnav" target="_blank" rel="noopener" href="#">打开 x_nav（建图 / 定位）</a>
  </div>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
$('xnav').href = location.protocol + '//' + location.hostname + ':' + (location.port === '18080' ? '18000' : '8000') + '/';
async function check() {
  try {
    const r = await fetch('/phone/teach/status', {cache: 'no-store', credentials: 'same-origin'});
    if (r.status === 401) { $('login').hidden = false; $('links').hidden = true; return; }
    location.replace('/teach');
  } catch (e) { $('login').hidden = true; $('links').hidden = false; }
}
$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('msg').textContent = '';
  try {
    const r = await fetch('/phone/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
      body: JSON.stringify({username: $('username').value, password: $('password').value})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || '登录失败');
    location.replace('/teach');
  } catch (err) { $('msg').textContent = err.message; }
});
check();
</script>
</html>
