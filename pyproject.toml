[tool.ruff]
line-length = 100
target-version = "py312"
# Frozen trees: the organiser SDK, dated field evidence, deliverable bundles and
# report sources. They are archives, not live code, and are never edited in place.
exclude = [
    "build", "install", "log", "upstream",
    "vendor",
    "evidence",
    "data",
    "reports",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",
    # This project is bilingual: Chinese full-width punctuation appears in strings,
    # comments and docstrings by design. RUF001-003 flag it as "ambiguous".
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["s10_perception", "s10_auto_nav", "s10_bringup", "s10_rl"]

[tool.ruff.lint.per-file-ignores]
# These are exact multiline C++ anchors applied to the private SDK. Wrapping their source
# lines would change the bytes patch_upstream.py must match.
"scripts/patch_upstream.py" = ["E501"]
# The field web app and its QA harness are written in a deliberately compact style
# (compound statements, long single-line assertions) so a whole check fits on a phone
# screen during a field session. Style is relaxed here; correctness rules still apply.
"tools/**" = ["E501", "E701", "E702", "E731", "E402", "SIM115"]
"scripts/**" = ["E501", "E701", "E702", "E402"]
"ros1_gateway/**" = ["E501", "E701", "E702", "E402", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["src", "training"]
python_files = ["test_*.py"]
markers = [
    "params: ROS parameter overrides for the node a test constructs",
]
